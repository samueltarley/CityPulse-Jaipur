    <script>
      // Intercept and handle Google Maps script errors / RefererNotAllowedMapError gracefully
      window.gm_authFailure = function() {
        console.warn('[Google Maps] Referrer authorization check required for domain:', window.location.origin);
        window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
      };

      window.addEventListener('error', function(e) {
        var msg = e && (e.message || '');
        var file = e && (e.filename || '');
        if (
          msg === 'Script error.' ||
          msg.indexOf('Google Maps') !== -1 ||
          msg.indexOf('RefererNotAllowedMapError') !== -1 ||
          file.indexOf('maps.googleapis.com') !== -1
        ) {
          console.warn('[Google Maps] Handled cross-origin map authorization notice:', msg);
          window.dispatchEvent(new CustomEvent('google-maps-auth-failure'));
          if (e.preventDefault) e.preventDefault();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          return true;
        }
      }, true);
    </script>
